<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#gold)" stroke-width="8" opacity="0.4"/>
  <!-- Central Shopping Bag & Nile Waves -->
  <g transform="translate(106, 106)">
    <!-- Bag Handle -->
    <path d="M90 120 C90 50, 210 50, 210 120" fill="none" stroke="url(#gold)" stroke-width="24" stroke-linecap="round"/>
    <!-- Bag Body -->
    <path d="M40 120 L260 120 L240 280 L60 280 Z" fill="url(#gold)"/>
    <!-- Egyptian Nile Wave inside -->
    <path d="M70 210 Q110 180 150 210 T230 210" fill="none" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
    <!-- Arabic Text / Symbol -->
    <text x="150" y="175" font-family="'Cairo', sans-serif" font-size="44" font-weight="900" fill="#0f172a" text-anchor="middle">نيل</text>
  </g>
</svg>
